<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>T04 – SVG House &amp; Garden</title>
  <style>
    body {
      margin: 2rem;
      background: #f4f7f2;
      font-family: system-ui, sans-serif;
    }

    svg {
      display: block;
      width: min(100%, 800px);
      height: auto;
      border: 2px solid #526b58;
      background: #dff3ff;
    }

    #scene-adjusted .house-outline {
      stroke: #573a26;
      stroke-width: 4;
    }

    #scene-adjusted .roof-outline {
      stroke: #573a26;
      stroke-width: 5;
    }

    #scene-adjusted .window-outline {
      stroke: #315966;
      stroke-width: 4;
    }

    #scene-adjusted .fence-line {
      stroke: #704c2e;
      stroke-dasharray: 12 7;
    }

    #scene-adjusted .stone-path {
      fill: #c9c4b8;
      stroke: #6c685f;
      stroke-width: 2;
    }

    #scene-adjusted .stone-joints {
      fill: none;
      stroke: #99958c;
      stroke-dasharray: 2 11;
      stroke-width: 2;
    }

    #scene-adjusted .mailbox-part {
      fill: #365d6b;
      stroke: #243d47;
      stroke-width: 2;
    }

    #scene-adjusted .smoke {
      fill: #ffffff;
      opacity: 0.5;
      stroke: #8c9b9d;
      stroke-width: 1;
    }
  </style>
</head>
<body>
  <figure id="scene-original">
  <svg viewBox="0 0 800 500" role="img" aria-labelledby="scene-title scene-desc">
    <title id="scene-title">T04 – SVG House &amp; Garden</title>
    <desc id="scene-desc">
      A sunny garden with a cloud, a tree, a small house with a chimney, door and two windows,
      a fence, a curved garden path, and a caption.
    </desc>

    <!-- Sky and grass -->
    <rect x="0" y="0" width="800" height="330" fill="#bde7ff" />
    <rect x="0" y="330" width="800" height="170" fill="#8fca72" />

    <!-- Sun and cloud -->
    <circle cx="690" cy="85" r="42" fill="#ffd34e" />
    <ellipse cx="145" cy="95" rx="48" ry="24" fill="#ffffff" />
    <ellipse cx="180" cy="82" rx="35" ry="31" fill="#ffffff" />
    <ellipse cx="215" cy="98" rx="42" ry="22" fill="#ffffff" />

    <!-- Tree -->
    <rect x="92" y="230" width="32" height="125" fill="#8b5a35" />
    <circle cx="108" cy="205" r="54" fill="#4f9b55" />
    <circle cx="72" cy="226" r="34" fill="#62ad5d" />
    <circle cx="143" cy="225" r="37" fill="#62ad5d" />

    <!-- House body, chimney, and roof -->
    <rect x="300" y="220" width="250" height="165" fill="#f2c27b" stroke="#6f4932" stroke-width="3" />
    <rect x="470" y="130" width="38" height="75" fill="#b85c45" stroke="#6f4932" stroke-width="3" />
    <polygon points="275,225 425,115 575,225" fill="#b94e3f" stroke="#6f4932" stroke-width="4" />

    <!-- Door and windows -->
    <rect x="395" y="290" width="62" height="95" rx="3" fill="#76503b" stroke="#543a2b" stroke-width="3" />
    <circle cx="445" cy="340" r="4" fill="#f6d66b" />
    <rect x="322" y="250" width="52" height="48" fill="#aee4f5" stroke="#6f4932" stroke-width="3" />
    <line x1="348" y1="250" x2="348" y2="298" stroke="#6f4932" stroke-width="3" />
    <line x1="322" y1="274" x2="374" y2="274" stroke="#6f4932" stroke-width="3" />
    <rect x="476" y="250" width="52" height="48" fill="#aee4f5" stroke="#6f4932" stroke-width="3" />
    <line x1="502" y1="250" x2="502" y2="298" stroke="#6f4932" stroke-width="3" />
    <line x1="476" y1="274" x2="528" y2="274" stroke="#6f4932" stroke-width="3" />

    <!-- Fence -->
    <polyline points="585,290 585,375 620,375 620,300 655,300 655,375 690,375 690,290 725,290 725,375 760,375 760,290"
      fill="none" stroke="#f4e4bd" stroke-width="8" stroke-linejoin="round" />
    <line x1="578" y1="325" x2="767" y2="325" stroke="#d3ad6b" stroke-width="7" />
    <line x1="578" y1="360" x2="767" y2="360" stroke="#d3ad6b" stroke-width="7" />

    <!-- Curved path -->
    <path d="M 425 385 C 410 420, 455 438, 435 500 L 560 500 C 525 445, 490 415, 457 385 Z"
      fill="#dfc596" stroke="#b99b68" stroke-width="3" />

    <!-- Garden flowers -->
    <line x1="225" y1="390" x2="225" y2="430" stroke="#3d7a43" stroke-width="4" />
    <circle cx="225" cy="383" r="9" fill="#ef7184" />
    <circle cx="215" cy="383" r="7" fill="#ffd34e" />
    <circle cx="235" cy="383" r="7" fill="#ffd34e" />
    <line x1="265" y1="400" x2="265" y2="435" stroke="#3d7a43" stroke-width="4" />
    <circle cx="265" cy="393" r="9" fill="#a17be0" />

    <!-- Caption -->
    <text x="400" y="472" text-anchor="middle" fill="#35543a" font-size="22" font-weight="600">
      Home in the garden
    </text>
  </svg>
    <figcaption>Original scene</figcaption>
  </figure>

  <figure id="scene-annotated-figure">
  <svg id="scene-annotated" viewBox="0 0 800 500" role="img" aria-labelledby="annotated-title annotated-desc">
    <title id="annotated-title">T04 – SVG House &amp; Garden (annotated)</title>
    <desc id="annotated-desc">
      A sunny garden with labels identifying examples of SVG shapes and their attributes.
    </desc>

    <!-- Sky and grass -->
    <rect x="0" y="0" width="800" height="330" fill="#bde7ff" />
    <rect x="0" y="330" width="800" height="170" fill="#8fca72" />

    <!-- Sun and cloud -->
    <circle cx="690" cy="85" r="42" fill="#ffd34e" />
    <ellipse cx="145" cy="95" rx="48" ry="24" fill="#ffffff" />
    <ellipse cx="180" cy="82" rx="35" ry="31" fill="#ffffff" />
    <ellipse cx="215" cy="98" rx="42" ry="22" fill="#ffffff" />

    <!-- Tree -->
    <rect x="92" y="230" width="32" height="125" fill="#8b5a35" />
    <circle cx="108" cy="205" r="54" fill="#4f9b55" />
    <circle cx="72" cy="226" r="34" fill="#62ad5d" />
    <circle cx="143" cy="225" r="37" fill="#62ad5d" />

    <!-- House body, chimney, and roof -->
    <rect x="300" y="220" width="250" height="165" fill="#f2c27b" stroke="#6f4932" stroke-width="3" />
    <rect x="470" y="130" width="38" height="75" fill="#b85c45" stroke="#6f4932" stroke-width="3" />
    <polygon points="275,225 425,115 575,225" fill="#b94e3f" stroke="#6f4932" stroke-width="4" />

    <!-- Door and windows -->
    <rect x="395" y="290" width="62" height="95" rx="3" fill="#76503b" stroke="#543a2b" stroke-width="3" />
    <circle cx="445" cy="340" r="4" fill="#f6d66b" />
    <rect x="322" y="250" width="52" height="48" fill="#aee4f5" stroke="#6f4932" stroke-width="3" />
    <line x1="348" y1="250" x2="348" y2="298" stroke="#6f4932" stroke-width="3" />
    <line x1="322" y1="274" x2="374" y2="274" stroke="#6f4932" stroke-width="3" />
    <rect x="476" y="250" width="52" height="48" fill="#aee4f5" stroke="#6f4932" stroke-width="3" />
    <line x1="502" y1="250" x2="502" y2="298" stroke="#6f4932" stroke-width="3" />
    <line x1="476" y1="274" x2="528" y2="274" stroke="#6f4932" stroke-width="3" />

    <!-- Fence -->
    <polyline points="585,290 585,375 620,375 620,300 655,300 655,375 690,375 690,290 725,290 725,375 760,375 760,290"
      fill="none" stroke="#f4e4bd" stroke-width="8" stroke-linejoin="round" />
    <line x1="578" y1="325" x2="767" y2="325" stroke="#d3ad6b" stroke-width="7" />
    <line x1="578" y1="360" x2="767" y2="360" stroke="#d3ad6b" stroke-width="7" />

    <!-- Curved path -->
    <path d="M 425 385 C 410 420, 455 438, 435 500 L 560 500 C 525 445, 490 415, 457 385 Z"
      fill="#dfc596" stroke="#b99b68" stroke-width="3" />

    <!-- Garden flowers -->
    <line x1="225" y1="390" x2="225" y2="430" stroke="#3d7a43" stroke-width="4" />
    <circle cx="225" cy="383" r="9" fill="#ef7184" />
    <circle cx="215" cy="383" r="7" fill="#ffd34e" />
    <circle cx="235" cy="383" r="7" fill="#ffd34e" />
    <line x1="265" y1="400" x2="265" y2="435" stroke="#3d7a43" stroke-width="4" />
    <circle cx="265" cy="393" r="9" fill="#a17be0" />

    <!-- Caption -->
    <text x="400" y="472" text-anchor="middle" fill="#35543a" font-size="22" font-weight="600">
      Home in the garden
    </text>

    <g id="annotations">
      <line x1="655" y1="46" x2="675" y2="56" />
      <text x="525" y="42">circle: cx=690, cy=85, r=42</text>

      <line x1="77" y1="312" x2="92" y2="300" />
      <text x="8" y="310">rect: x=92, y=230, width=32, height=125</text>

      <line x1="90" y1="139" x2="151" y2="107" />
      <text x="8" y="143">ellipse: cx=180, cy=82, rx=35, ry=31</text>

      <line x1="351" y1="319" x2="348" y2="298" />
      <text x="293" y="326">line: (348,250) -&gt; (348,298)</text>

      <line x1="654" y1="395" x2="620" y2="375" />
      <text x="590" y="405">polyline: (585,290) (585,375) (620,375)</text>

      <line x1="275" y1="225" x2="250" y2="215" />
      <text x="8" y="213">polygon: (275,225) (425,115) (575,225)</text>

      <line x1="560" y1="435" x2="540" y2="449" />
      <text x="545" y="422">path: M425,385 C410,420 455,438 435,500</text>

      <line x1="520" y1="474" x2="465" y2="472" />
      <text x="530" y="480">text: x=400, y=472</text>
    </g>
  </svg>
    <figcaption>Annotated scene (Step 2)</figcaption>
  </figure>

  <figure id="scene-adjusted-figure">
  <svg id="scene-adjusted" viewBox="0 0 800 500" role="img" aria-labelledby="adjusted-title adjusted-desc">
    <title id="adjusted-title">T04 – SVG House &amp; Garden (adjusted)</title>
    <desc id="adjusted-desc">
      A balanced garden scene with a stone path, mailbox, dashed fence, and chimney smoke.
    </desc>

    <!-- Sky and grass -->
    <rect x="0" y="0" width="800" height="330" fill="#bde7ff" />
    <rect x="0" y="330" width="800" height="170" fill="#8fca72" />

    <!-- Curved stone path leads to the adjusted doorway. -->
    <path class="stone-path" d="M 387 384 C 385 405, 398 417, 420 431 C 444 446, 459 468, 456 500 L 560 500 C 536 473, 522 451, 502 432 C 482 413, 466 400, 449 384 Z" />
    <path class="stone-joints" d="M 418 423 C 451 447, 470 470, 470 500 M 484 418 C 514 447, 531 474, 540 500" />

    <!-- Shift the tree slightly right to balance the house. -->
    <g transform="translate(12 0)">
      <rect x="92" y="230" width="32" height="125" fill="#8b5a35" />
      <circle cx="108" cy="205" r="54" fill="#4f9b55" />
      <circle cx="72" cy="226" r="34" fill="#62ad5d" />
      <circle cx="143" cy="225" r="37" fill="#62ad5d" />
    </g>

    <!-- Move the house slightly left; stronger outlines improve contrast. -->
    <g transform="translate(-8 0)">
      <rect class="house-outline" x="300" y="220" width="250" height="165" fill="#f2c27b" stroke="#6f4932" stroke-width="3" />
      <rect class="house-outline" x="470" y="130" width="38" height="75" fill="#b85c45" stroke="#6f4932" stroke-width="3" />
      <polygon class="roof-outline" points="275,225 425,115 575,225" fill="#b94e3f" stroke="#6f4932" stroke-width="4" />

      <!-- Door and windows -->
      <rect class="house-outline" x="395" y="290" width="62" height="95" rx="3" fill="#76503b" stroke="#543a2b" stroke-width="3" />
      <circle cx="445" cy="340" r="4" fill="#f6d66b" />
      <rect class="window-outline" x="322" y="250" width="52" height="48" fill="#aee4f5" stroke="#6f4932" stroke-width="3" />
      <line class="window-outline" x1="348" y1="250" x2="348" y2="298" stroke="#6f4932" stroke-width="3" />
      <line class="window-outline" x1="322" y1="274" x2="374" y2="274" stroke="#6f4932" stroke-width="3" />
      <rect class="window-outline" x="476" y="250" width="52" height="48" fill="#aee4f5" stroke="#6f4932" stroke-width="3" />
      <line class="window-outline" x1="502" y1="250" x2="502" y2="298" stroke="#6f4932" stroke-width="3" />
      <line class="window-outline" x1="476" y1="274" x2="528" y2="274" stroke="#6f4932" stroke-width="3" />
    </g>

    <!-- Dashed fence with varied rail and picket widths. -->
    <polyline class="fence-line" points="585,290 585,375 620,375 620,300 655,300 655,375 690,375 690,290 725,290 725,375 760,375 760,290"
      fill="none" stroke="#f4e4bd" stroke-width="8" stroke-linejoin="round" />
    <line class="fence-line" x1="578" y1="325" x2="767" y2="325" stroke="#d3ad6b" stroke-width="7" />
    <line class="fence-line" x1="578" y1="360" x2="767" y2="360" stroke="#d3ad6b" stroke-width="7" />

    <!-- Mailbox sits beside the path. -->
    <rect class="mailbox-part" x="523" y="391" width="5" height="34" />
    <rect class="mailbox-part" x="509" y="386" width="34" height="22" rx="3" />
    <polygon class="mailbox-part" points="543,389 553,394 543,399" />

    <!-- Soft smoke rises from the chimney. -->
    <ellipse class="smoke" cx="481" cy="122" rx="8" ry="5" />
    <ellipse class="smoke" cx="494" cy="109" rx="9" ry="6" />
    <ellipse class="smoke" cx="481" cy="96" rx="7" ry="5" />

    <!-- Garden flowers -->
    <line x1="225" y1="390" x2="225" y2="430" stroke="#3d7a43" stroke-width="4" />
    <circle cx="225" cy="383" r="9" fill="#ef7184" />
    <circle cx="215" cy="383" r="7" fill="#ffd34e" />
    <circle cx="235" cy="383" r="7" fill="#ffd34e" />
    <line x1="265" y1="400" x2="265" y2="435" stroke="#3d7a43" stroke-width="4" />
    <circle cx="265" cy="393" r="9" fill="#a17be0" />

    <!-- Caption -->
    <text x="400" y="472" text-anchor="middle" fill="#35543a" font-size="22" font-weight="600">
      Home in the garden
    </text>
  </svg>
    <figcaption>Adjusted scene (Step 3)</figcaption>
  </figure>
</body>
</html>
